[project]
name = "entirius-django-omnibus"
version = "3.0.1"
description = "Omnibus price tracking for Entirius: the lowest price of the last 30 days per product, for EU price directive compliance"
keywords = ["django", "ecommerce", "entirius", "omnibus", "pricing", "price-history", "eu-directive"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "marshmallow",
    "marshmallow-dataclass",
    "entirius-django-checkout>=9.0.0",
    "entirius-django-pim>=3.0.0",
    "entirius-django-pricemanager>=4.0.1",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-bievents>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "dj-database-url", "psycopg[binary]"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-omnibus/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-omnibus"
Changelog = "https://github.com/entirius/entirius-django-omnibus/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-django-omnibus/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_omnibus"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S108"]
# Legacy migrated 1:1 (F821 in calculate_omnibus_price = latent bugs on error paths)
"src/django_omnibus/worker/*.py" = ["F821", "E731", "F401", "B904"]
"src/django_omnibus/models/product_representation.py" = ["DJ012"]
"src/django_omnibus/models/omnibus_price.py" = ["DJ001", "DJ008"]
"src/django_omnibus/tests/*.py" = ["S101", "F841", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["django_omnibus"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# mock / line_profiler / django_regional: imported only by the legacy in-package
# developer tests (src/django_omnibus/tests/ — outside testpaths, not executed);
# moving them to tests/ is tracked internally
DEP001 = ["mock", "line_profiler"]
DEP003 = ["django_regional"]
